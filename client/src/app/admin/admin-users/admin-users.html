<div class="container mt-5">
    <h2> Manage Users </h2>
    @if (showEditForm && editingUser) {

    <div class="modal-backdrop-custom">

        <div class="user-modal">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4>Edit User</h4>

                <button type="button" class="btn-close" (click)="cancelEdit()">
                </button>

            </div>


            <form (ngSubmit)="saveEdit()">


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input type="text" class="form-control" name="username" [(ngModel)]="editingUser.username" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select class="form-control" name="role" [(ngModel)]="editingUser.role" required>

                        <option value="User">
                            User
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                    </select>

                </div>


                <div class="text-end">

                    <button type="button" class="btn btn-secondary me-2" (click)="cancelEdit()">

                        Cancel

                    </button>


                    <button type="submit" class="btn btn-primary">

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

    }
    <table class="table table-striped mt-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th> Role </th>
                <th> Actions </th>
            </tr>
        </thead>
        <tbody>
            @for (user of users; track user.id){
            <tr>
                <th>{{user.id}}</th>
                <th>{{user.username}}</th>
                <th>{{user.role}}</th>

                <td class="text-nowrap">
                    <button class="btn btn-primary btn-sm me-2" (click)="editUser(user)"> Edit </button>
                    <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id)"> Delete </button>
                </td>
            </tr>

            }
        </tbody>
    </table>
    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChanged)="onPageChanged($event)">
    </app-pagination>
</div>
