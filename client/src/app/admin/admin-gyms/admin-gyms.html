<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manage Gyms</h2>
        <button type="button" class="btn btn-success" (click)="showAddForm()">Add Gym</button>
    </div>

    @if (showForm) {
    <p style="color: red;">TEST FORM</p>
    <div class="modal-backdrop-custom">
        <div class="gym-modal">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Add Gym</h4>
                <button type="button" class="btn-close" (click)="cancelAdd()"></button>
            </div>

            <form (ngSubmit)="addGym()">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" [(ngModel)]="newGym.name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" [(ngModel)]="newGym.address" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Latitude</label>
                    <input type="number" class="form-control" name="latitude" [(ngModel)]="newGym.latitude" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Longitude</label>
                    <input type="number" class="form-control" name="longitude" [(ngModel)]="newGym.longitude" required>
                </div>

                <div class="text-end">
                    <button type="button" class="btn btn-secondary me-2" (click)="cancelAdd()">Cancel</button>
                    <button type="submit" class="btn btn-success" [disabled]="isSaving">
                        @if (isSaving) { Adding... } @else { Add Gym }
                    </button>
                </div>
            </form>
        </div>
    </div>
    }

    @if (showEditForm && editingGym) {
    <div class="modal-backdrop-custom">
        <div class="gym-modal">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Edit Gym</h4>
                <button type="button" class="btn-close" (click)="cancelEdit()"></button>
            </div>

            <form (ngSubmit)="saveEdit()">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="editName" [(ngModel)]="editingGym.name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="editAddress" [(ngModel)]="editingGym.address"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Latitude</label>
                    <input type="number" class="form-control" name="editLatitude" [(ngModel)]="editingGym.latitude"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Longitude</label>
                    <input type="number" class="form-control" name="editLongitude" [(ngModel)]="editingGym.longitude"
                        required>
                </div>

                <div class="text-end">
                    <button type="button" class="btn btn-secondary me-2" (click)="cancelEdit()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    }

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            @for (gym of gyms; track gym.id) {
            <tr>
                <td>{{ gym.id }}</td>
                <td>{{ gym.name }}</td>
                <td>{{ gym.address }}</td>
                <td>{{ gym.latitude }}</td>
                <td>{{ gym.longitude }}</td>
                <td class="text-nowrap">
                    <button type="button" class="btn btn-primary btn-sm me-2" (click)="editGym(gym)">Edit</button>
                    <button type="button" class="btn btn-danger btn-sm" (click)="deleteGym(gym.id)">Delete</button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
