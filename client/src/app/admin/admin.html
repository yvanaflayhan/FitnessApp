<div class="container mt-5">
    <h2>Admin Dashboard </h2>
     <table class="table table-striped mt-4">

    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
      </tr>
    </thead>

    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.role }}</td>
        </tr>
      }
    </tbody>

  </table>
</div>
